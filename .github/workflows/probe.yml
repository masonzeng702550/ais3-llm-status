name: probe

on:
  schedule:
    # Five minutes is GitHub's shortest cron, and in practice it is throttled to
    # roughly once an hour. This schedule is therefore only a keepalive: each run
    # loops internally for hours (see the Probe step), and the concurrency queue
    # below means the next run is already waiting when the current one exits.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  # Deliberately not cancelling: a cancelled round leaves a hole in the data,
  # which is worse than two rounds briefly overlapping.
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # Just past runSeconds; GitHub kills a job at 6h regardless.
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: .data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Probe on a loop
        env:
          AIS3_API_KEY: ${{ secrets.AIS3_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -u
          interval=$(awk '/^  intervalSeconds:/ {print $2; exit}' config/monitors.yml)
          duration=$(awk '/^  runSeconds:/ {print $2; exit}' config/monitors.yml)
          echo "looping every ${interval}s for ${duration}s"

          cd .data
          git config user.name  "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          cd ..

          publish() {
            cd .data
            git add -A
            if git diff --staged --quiet; then cd ..; return 0; fi
            git commit -q -m "probe: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for _ in 1 2 3; do
              if git push -q 2>/dev/null; then cd ..; return 0; fi
              # Another run got there first. Our snapshot is the newer one, so
              # replay our files on top of theirs rather than trying to merge.
              git fetch -q --depth=1 origin data
              git reset -q --soft FETCH_HEAD
              git commit -q -m "probe: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            done
            echo "::warning::push failed after 3 attempts"
            cd ..
            return 0
          }

          deadline=$(( $(date +%s) + duration ))
          rounds=0
          while :; do
            started=$(date +%s)
            npx tsx scripts/probe.ts --data .data/data || echo "::warning::round failed"
            publish
            rounds=$(( rounds + 1 ))

            now=$(date +%s)
            [ "$now" -ge "$deadline" ] && break
            nap=$(( interval - (now - started) ))
            [ "$nap" -gt 0 ] && sleep "$nap"
          done
          echo "completed $rounds rounds"
