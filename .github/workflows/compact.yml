name: compact

on:
  schedule:
    # Daily at 18:20 UTC. At a 30s probe interval the data branch takes ~2,900
    # commits a day, so monthly compaction would let it grow unusably large.
    - cron: '20 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          path: .data
          fetch-depth: 0

      # None of that commit history has any value: every measurement already
      # lives inside the files themselves, in raw/ and daily/. Squash the branch
      # to a single commit so the repository does not grow without bound.
      - name: Squash data branch history
        working-directory: .data
        run: |
          before=$(git rev-list --count HEAD)
          git config user.name  "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git checkout --orphan squashed
          git add -A
          git commit -m "compact: snapshot at $(date -u +%Y-%m-%d)"
          git branch -M squashed data
          git push --force origin data
          echo "squashed $before commits into 1"
