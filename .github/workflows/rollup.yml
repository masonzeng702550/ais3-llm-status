name: rollup

on:
  schedule:
    # 00:05 Asia/Taipei = 16:05 UTC the previous day.
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rollup
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: .data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fold raw records into daily rollups
        run: npx tsx scripts/rollup.ts --data .data/data

      - name: Commit rollups
        working-directory: .data
        run: |
          git config user.name  "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "rollup: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin data || exit 1
          done
          exit 1

      - name: Refresh the published snapshot
        # The site bakes in a build-time snapshot; nudge it once a day so the
        # no-JavaScript view does not drift further than 24 hours behind.
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
