name: rollup

on:
  schedule:
    # 00:05 Asia/Taipei = 16:05 UTC the previous day.
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Needed by the final step, which dispatches deploy.yml. Without it the
  # default token gets a 403 and fails the run after the rollup itself
  # succeeded.
  actions: write

concurrency:
  group: rollup
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: .data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fold raw records into daily rollups and publish
        run: |
          set -u
          git -C .data config user.name  "status-bot"
          git -C .data config user.email "status-bot@users.noreply.github.com"

          # The probe loop pushes every 30 seconds and writes summary.json too,
          # so a rebase here lands in a content conflict on generated JSON that
          # no three-way merge can resolve. Rebuild instead of merge: take the
          # newest remote state, recompute (rollup.ts is a pure function of what
          # is on disk), and commit that.
          for attempt in 1 2 3 4 5; do
            git -C .data fetch -q --depth=1 origin data
            git -C .data reset -q --hard FETCH_HEAD

            npx tsx scripts/rollup.ts --data .data/data

            # Only the paths this job owns. status.json, minutes.json, state.json
            # and badges belong to the probe loop — staging them would roll its
            # newer measurements backwards.
            git -C .data add -A data/daily data/summary.json data/raw

            if git -C .data diff --staged --quiet; then
              echo "nothing to publish"
              exit 0
            fi

            git -C .data commit -q -m "rollup: $(date -u +%Y-%m-%d)"
            if git -C .data push -q; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push rejected by a concurrent probe commit, recomputing"
          done

          echo "::error::could not publish rollup after 5 attempts"
          exit 1

      - name: Refresh the published snapshot
        # The site bakes in a build-time snapshot; nudge it once a day so the
        # no-JavaScript view does not drift further than 24 hours behind.
        #
        # Cosmetic next to the rollup above: the live page fetches its data
        # client-side every 30s regardless. Never fail the run over it — a red
        # cross here would imply the measurements were lost, which they were not.
        continue-on-error: true
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
