<svg xmlns="http://www.w3.org/2000/svg" width="180" height="20" role="img" aria-label="Web Chat UI: operational">
  <title>Web Chat UI: operational</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r"><rect width="180" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="90" height="20" fill="#555"/>
    <rect x="90" width="90" height="20" fill="#16a34a"/>
    <rect width="180" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="45" y="15" fill="#010101" fill-opacity=".3">Web Chat UI</text>
    <text x="45" y="14">Web Chat UI</text>
    <text x="135" y="15" fill="#010101" fill-opacity=".3">operational</text>
    <text x="135" y="14">operational</text>
  </g>
</svg>
